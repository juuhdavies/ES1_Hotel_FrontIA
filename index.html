<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistente IA - Hotel Elfsong</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .chat-container {
            max-width: 800px;
            margin: 0 auto;
        }
        .chat-box {
            height: 450px;
            overflow-y: auto;
            border-top: 1px solid #dee2e6;
            border-bottom: 1px solid #dee2e6;
            background-color: #f8f9fa;
        }
        .chat-message {
            max-width: 80%;
            margin-bottom: 1rem;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
        }
        .chat-message.user {
            background-color: #0d6efd;
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 0;
        }
        .chat-message.bot {
            background-color: #ffffff;
            color: #212529;
            margin-right: auto;
            border: 1px solid #dee2e6;
            border-bottom-left-radius: 0;
        }
    </style>
</head> 
<body class="d-flex flex-column min-vh-100 bg-light py-4">

    <main class="container my-auto flex-grow-1">
        <div class="chat-container">
            <div class="p-4 mb-4 bg-white rounded-3 shadow-sm text-center">
                <h1 class="display-6 fw-bold text-dark">Assistente Virtual Elfsong</h1>
                <p class="fs-6 text-muted mb-0">Tire suas dúvidas, consulte reservas ou solicite serviços de forma automática.</p>
            </div>

            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-header bg-white py-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="fw-bold text-dark">Oi, eu sou a IA do Hotel Elfsong. O que deseja?</span>
                        <span class="badge bg-success">Online</span>
                    </div>
                </div>
                
                <div class="card-body p-3 chat-box" id="chat-box">
                    <div class="chat-message bot shadow-sm">
                        <strong>Atendente Virtual:</strong><br>
                        Olá! Como posso ajudar você hoje? Você pode consultar acomodações, verificar valores ou realizar reservas.
                    </div>
                </div>

                <div class="card-footer bg-white p-3">
                    <form id="form-chat" onsubmit="enviarMensagem(event)" class="d-flex gap-2">
                        <input type="text" id="input-mensagem" class="form-control" placeholder="Digite sua dúvida ou pedido..." required autocomplete="off">
                        <button type="submit" id="btn-enviar" class="btn btn-primary px-4">Enviar</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script src="../js/ia.js"></script>
</body>
</html>
